<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>播放器</title>
  <script type="module" crossorigin src="./assets/player-BywfIc_G.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/amll-core-BT0yOS92.js">
  <link rel="stylesheet" crossorigin href="./assets/player-DtyLooF7.css">
</head>
<body>
  <!-- 暗色叠加层 (背景偏白时加深) -->
  <div id="dim-overlay"></div>
  <div id="bg-canvas"></div>

  <div id="login-corner">
    <span id="login-text" onclick="window.showLogin?.()">未登录</span>
  </div>

  <div id="app">
    <!-- 左栏 -->
    <div id="left-col">
      <div class="spacer t"></div>
      <div id="content-wrap">
        <div id="cover-section">
          <img id="cover-img" src="" alt="cover">
        </div>
        <div id="below-section">
          <div id="song-title">等待播放</div>
          <div id="artist-name"></div>
          <div id="progress-bar">
            <button id="like-btn" class="like-btn" title="喜欢">♡</button>
            <div id="progress-track">
              <div id="progress-fill"></div>
            </div>
            <div id="time-display">
              <span id="time-current">00:00</span>
              <span id="time-total">00:00</span>
            </div>
          </div>
          <div id="buttons">
            <button id="prev-btn">◁◁</button>
            <button id="play-btn" class="main-btn">▶</button>
            <button id="next-btn">▷▷</button>
          </div>
          <div id="volume-bar">
            <span id="vol-icon">♪</span>
            <div id="volume-track">
              <div id="volume-fill" style="width:80%"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="spacer b"></div>
    </div>

    <!-- 右栏: 歌词 -->
    <div id="right-col">
      <div id="lyric-container"></div>
    </div>
  </div>

  <!-- 登录弹窗 -->
  <div id="login-modal" class="hidden" onclick="if(event.target===this)window.closeLogin?.()">
    <div id="login-modal-content">
      <span id="login-close" onclick="window.closeLogin?.()">&times;</span>
      <h2>登录</h2>
      <p>扫码获取 320kbps 音质</p>
      <div id="qr-code"><img id="qr-img"></div>
      <p id="qr-tip">打开网易云 App 扫码</p>
      <div id="login-success" class="hidden">
        <span>✓</span>
        <p>登录成功</p>
        <button onclick="window.closeLogin?.()">关闭</button>
      </div>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>
</body>
</html>
