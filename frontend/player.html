<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>▶ 播放器</title>
<style>
/* 不要用 `*{margin:0;padding:0}` 全局重置:它会清掉 AMLL 歌词组件内部元素依赖的内/外边距,
   打乱行高测量,导致当前行随播放逐渐下移。只对 html/body 做最小重置。 */
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:14px;z-index:1}

/* 收藏星标按钮：与菜单按钮同水平线对齐、相同圆形蒙版背景与尺寸 */
.favStar{align-self:center!important;width:3.5vh!important;height:3.5vh!important;background:#ffffff15!important;border-radius:50%!important;opacity:1!important;margin-left:16px;padding:0!important}
.favStar svg{width:58%!important;height:58%!important}
@media screen and (max-width:1000px){.favStar{width:max(2em,min(5vw,4vh))!important;height:max(2em,min(5vw,4vh))!important}}

/* 歌词字号通过库的 lyricSizePresetAtom 控制(见 player.tsx),不要用 !important 覆盖 font-size,
   否则长行换行会撑破 AMLL 的逐行定位计算,导致当前行随播放进度逐渐下移。 */

/* 登录弹窗 (保留, React 之外的覆盖层) */
#lModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;align-items:center;justify-content:center}
#lModal>div{background:#14101f;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;width:260px;text-align:center;position:relative}
#lModal h2{font-size:15px;margin-bottom:4px;color:#ccc}
#lModal p{color:#666;font-size:11px;margin-bottom:12px}
#qrc{width:140px;height:140px;margin:0 auto 8px;background:#fff;border-radius:8px;padding:4px;display:flex;align-items:center;justify-content:center}
#qrc img{width:100%;height:100%;object-fit:contain}
#lClose{position:absolute;top:8px;right:12px;cursor:pointer;color:#666;font-size:18px;line-height:1}
#ls{display:none;padding:8px}
#ls button{margin-top:6px;padding:4px 14px;border:none;border-radius:6px;background:#2a2a3a;color:#ccc;cursor:pointer;font-size:11px}
</style>
</head>
<body>
<div id="loading">加载播放器…</div>
<div id="root"></div>
<audio id="audio" preload="auto"></audio>

<div id="lModal">
  <div>
    <span id="lClose">&times;</span>
    <h2>扫码登录</h2>
    <p>获取 320kbps 音质</p>
    <div id="qrc"><img id="qri" src=""></div>
    <p id="qtip">打开网易云 App 扫码</p>
    <div id="ls"><span style="font-size:28px">✓</span><p style="margin:4px 0;color:#888">登录成功</p><button id="lDone">关闭</button></div>
  </div>
</div>

<script type="module" src="/src/player.tsx"></script>
</body>
</html>
